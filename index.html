<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محاكاة حركة الشمس والأرض السينمائية</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000000; 
            font-family: sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas { 
            display: block; 
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.9);
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 18px;
            border-radius: 12px;
            pointer-events: none;
            text-align: center;
            width: 85%;
            max-width: 400px;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { margin: 0 0 4px 0; font-size: 14px; color: #fff; }
        p { margin: 0; font-size: 11px; color: #ccc; line-height: 1.4; }
    </style>
    <!-- استدعاء مستقر ومضمون لمكتبات التفاعل ثلاثي الأبعاد -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

<div id="info">
    <h1>أنيميشن فلكي سينمائي 3D</h1>
    <p>الأرض ثابتة في المركز • الشمس ترسم مسار ∞ عمودي وتدور حول محورها</p>
    <p style="font-size: 9px; margin-top: 4px; color: #888;">* المس الشاشة وحرك لرؤية الأبعاد والكون من زوايا مختلفة</p>
</div>

<script>
    // 1. إعداد المشهد والـ Renderer المتوافق مع الهواتف الذكية
    const scene = new THREE.Scene();
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // حماية كرت الشاشة من الضغط
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 14, 24);

    // إضافة إضاءة محيطة كافية لضمان رؤية كوكب الأرض بوضوح دائم
    const ambientLight = new THREE.AmbientLight(0x223344, 1.2);
    scene.add(ambientLight);

    // 2. الفضاء الخارجي والنجوم المتلألئة
    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = 2000; // تقليل العدد قليلاً لزيادة سلاسة الأداء على الجوال
    const starPositions = new Float32Array(starsCount * 3);

    for(let i = 0; i < starsCount * 3; i++) {
        starPositions[i] = (Math.random() - 0.5) * 400;
    }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, sizeAttenuation: true });
    const starField = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(starField);

    // 3. كوكب الأرض في المركز (0, 0, 0)
    const earthGeometry = new THREE.SphereGeometry(3, 32, 32);
    const earthMaterial = new THREE.MeshStandardMaterial({ 
        color: 0x1a5276, 
        roughness: 0.5,
        metalness: 0.3
    });
    const earth = new THREE.Mesh(earthGeometry, earthMaterial);
    scene.add(earth);

    // 4. الشمس (مجسم مضيء تماماً)
    const sunGeometry = new THREE.SphereGeometry(1.1, 32, 32);
    const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
    const sun = new THREE.Mesh(sunGeometry, sunMaterial);
    scene.add(sun);

    // مصباح نقطي مدمج مع الشمس ليحاكي أشعتها الساقطة على الأرض
    const sunLight = new THREE.PointLight(0xffffff, 3.0, 120);
    sun.add(sunLight);

    // 5. متحكم الكاميرا التفاعلي للمس والماوس
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.maxDistance = 60; // لمنع الكاميرا من الابتعاد كثيراً في الفضاء
    controls.minDistance = 8;

    // 6. تشغيل محاكي الحركة المزدوجة ومسار اللانهائية 8
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);

        const elapsedTime = clock.getElapsedTime();
        const orbitSpeed = elapsedTime * 0.45; // سرعة دورتها حول الأرض

        const orbitRadius = 12; // مسافة البعد عن الأرض

        // معادلات الأنالما الرياضية الدقيقة لتكوين رمز اللانهائية العمودي
        sun.position.x = orbitRadius * Math.cos(orbitSpeed);
        sun.position.z = orbitRadius * Math.sin(orbitSpeed);
        sun.position.y = 6.0 * Math.sin(2 * orbitSpeed); // التأرجح الرأسي (أعلى وأسفل مرتين بكل دورة)

        // الدوران الذاتي السريع للشمس حول محورها
        sun.rotation.y += 0.04;

        // دوران خلفية الكون ببطء
        starField.rotation.y = elapsedTime * 0.003;

        controls.update();
        renderer.render(scene, camera);
    }

    // صيانة وتحديث الأبعاد التلقائي عند تدوير الشاشة أو تغيير حجمها
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
